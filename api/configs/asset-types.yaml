    icon: cpu
    class: host
    alias_of: { type: host, sub_type: compute }
    legacy_category: infrastructure
    identity_keys: [cloud_id, host_id, mac, ip, name]
    attributes:
      - { name: provider, type: enum, values: [aws, gcp, azure, other], facet: true, group: true }
      - { name: instance_id, type: string }
      - { name: instance_type, type: string, facet: true, group: true }
      - { name: region, type: string, facet: true, group: true }
