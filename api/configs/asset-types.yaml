# =============================================================================
# Asset Type Registry: the single source of truth for asset types
# =============================================================================
#
# Design: docs/rfcs/RFC-042-asset-inventory-v2.md (§6.3) and
#         docs/architecture/asset-inventory-v2.md.
#
# This file declares every asset type once: its class, the lens the class
# belongs to, its typed attribute schema, facets and group-by fields, row
# columns and card renderer, detail sections, identity keys and the
# legacy category. Generated from it by `make generate-asset-types`:
#
#   - pkg/domain/asset/registry_generated.go   (Go data, TypeAliases,
#                                               legacy categories)
#   - ../web/src/features/asset-types/registry.generated.ts
#   - the SQL block between the asset-type-registry markers in the newest
#     migration that carries them (printed by `make asset-types-sql`; the
#     generator never edits a migration)
#
# `GET /api/v1/asset-types` serves the same data. The CI step
# "Asset Types Drift" (`go run ./cmd/gen-asset-types -check`) fails when the
# YAML, the generated files or the migration block disagree;
# tests/integration/asset_type_registry_db_test.go checks the live schema.
#
# Workflow:
#   1. Edit this file.
#   2. make generate-asset-types
#   3. If class, lens or alias data changed: add a migration whose body is
#      `make asset-types-sql` (it re-seeds asset_types and re-backfills
#      assets.asset_class / assets.asset_lens).
#   4. Commit the YAML, the generated files and the migration together.
#
# Classes and lenses are fixed in code, not tenant-editable (RFC-042 D18).
# Lens, class and type ids must not be a reserved /assets/ page segment
# (all, changes, duplicates, groups, services, suggestions); the generator
# rejects them.
# Tenants organise with groups and labels.
# =============================================================================

# Lenses: the inventory tabs. Order is display order.
lenses:
  - id: external_surface
    label: External surface
    description: Internet-facing names, addresses, certificates, services and web endpoints.
    row: service_card
    default_group_by: class
  - id: applications
    label: Applications
    description: Web applications, websites, APIs and mobile apps.
    row: table
    default_group_by: type
  - id: cloud_infra
    label: Cloud & infrastructure
    description: Hosts, endpoints, serverless functions and cloud accounts.
    row: table
    default_group_by: class
  - id: containers_k8s
    label: Containers & Kubernetes
    description: Containers, clusters and artifact registries.
    row: table
    default_group_by: class
  - id: code
    label: Code
    description: Source code repositories.
    row: table
    default_group_by: type
  - id: identities
    label: Identities
    description: Users, roles and machine identities.
    row: table
    default_group_by: type
  - id: data
    label: Data
    description: Databases, data stores and storage buckets.
    row: table
    default_group_by: type
  - id: network
    label: Network
    description: Networks, VPCs, subnets, firewalls and load balancers.
    row: table
    default_group_by: type

# Classes: the abstract kind above the type (JupiterOne `_class`).
# Exactly one lens per class, except `other`, which only shows under All assets.
classes:
  - id: domain
    label: Domain
    lens: external_surface
    jupiterone: Domain / DomainRecord
  - id: ip_address
    label: IP address
    lens: external_surface
    jupiterone: IpAddress
  - id: certificate
    label: Certificate
    lens: external_surface
    jupiterone: Certificate
  - id: service
    label: Service
    lens: external_surface
    jupiterone: Port / NetworkEndpoint
  - id: web_endpoint
    label: Web endpoint
    lens: external_surface
    jupiterone: ApplicationEndpoint
  - id: application
    label: Application
    lens: applications
    jupiterone: Application
  - id: host
    label: Host
    lens: cloud_infra
    jupiterone: Host / Device
  - id: function
    label: Function
    lens: cloud_infra
    jupiterone: Function
  - id: cloud_account
    label: Cloud account
    lens: cloud_infra
    jupiterone: Account
  - id: container
    label: Container
    lens: containers_k8s
    jupiterone: Container / Workload
  - id: cluster
    label: Cluster
    lens: containers_k8s
    jupiterone: Cluster
  - id: artifact_registry
    label: Artifact registry
    lens: containers_k8s
    jupiterone: Repository (artifact)
  - id: code_repo
    label: Code repository
    lens: code
    jupiterone: CodeRepo
  - id: identity
    label: Identity
    lens: identities
    jupiterone: User / AccessRole / NHI
  - id: data_store
    label: Data store
    lens: data
    jupiterone: DataStore / Database
  - id: network
    label: Network
    lens: network
    jupiterone: Network / Firewall / Gateway
  - id: other
    label: Other
    jupiterone: Entity

# Legacy categories (formerly hand-written in pkg/domain/asset/category.go).
# Kept so the `category` field of asset responses does not change. New code
# uses class and lens.
legacy_categories:
  - { id: external_surface, label: External Surface }
  - { id: application, label: Applications }
  - { id: infrastructure, label: Infrastructure }
  - { id: network, label: Network }
  - { id: cloud, label: Cloud }
  - { id: data, label: Data }
  - { id: code, label: Code }
  - { id: identity, label: Identity }
  - { id: other, label: Other }

# Card renderers: a closed set the web implements. The API ships names only.
cards: [generic, domain, ip_address, certificate, service, web_endpoint, application, host, function, cloud_account, container, cluster, artifact_registry, repository, identity, data_store, network]

# Detail sections: a closed set the web implements.
sections:
  - { id: overview, label: Overview }
  - { id: attributes, label: Attributes }
  - { id: findings, label: Findings }
  - { id: services, label: Services }
  - { id: dns, label: DNS }
  - { id: certificate, label: Certificate }
  - { id: technologies, label: Technologies }
  - { id: components, label: Components }
  - { id: secrets, label: Secrets }
  - { id: branches, label: Branches }
  - { id: relationships, label: Relationships }
  - { id: owners, label: Owners }
  - { id: exposure, label: Exposure }
  - { id: sources, label: Sources }
  - { id: scans, label: Scans }
  - { id: history, label: History }

# Core fields every type shares (RFC-042 §6.3.4). Row columns may name a core
# field or one of the type's own attributes.
core_fields: [name, type, sub_type, class, lens, criticality, effective_criticality, exposure, owner, labels, findings.open, first_seen, last_seen, status]

# Identity keys: RFC-028 identifier kinds (pkg/domain/asset/identifier.go),
# `name` (exact canonical name) or `attr.<attribute>` for a type attribute.
# Listed in match order; every type ends with `name`.
identity_kinds: [host_id, cloud_id, bios_uuid, serial_number, mac, scm_repo_id, fqdn, hostname, ip]

# Names used in configs/relationship-types.yaml constraints that are not
# registry types. Resolving them here makes the relationship constraints
# point at real (type, sub_type) pairs, so the server can enforce them.
virtual_types:
  - { name: k8s_cluster, type: kubernetes, sub_type: cluster }
  - { name: k8s_workload, type: kubernetes, sub_type: workload }
  - { name: container_image, type: container, sub_type: image }
  - { name: api_collection, type: application, sub_type: api }
  - { name: api_endpoint, type: discovered_url }
  - { name: identity_provider, type: identity, sub_type: identity_provider }
  # A credential is a secret, not an identity; secrets become a type of
  # their own (RFC-042 §6.3.8 O4). Until then its constraints are skipped.
  - { name: credential, unmodelled: true }
  - { name: mobile, type: mobile_app }

# Attribute types: string, int, number, bool, time, enum (needs values),
# list (of strings) and object (opaque). Only string, int, enum and bool
# attributes can be facets or group-by fields.
#
# Core types and aliases (RFC-042 §6.3.8, docs/rfcs/RFC-042-asset-inventory-v2.md):
#
#   - A type without `alias_of` is a core type: the only values
#     assets.asset_type holds.
#   - `alias_of` marks an input name. Every write path (REST, import,
#     ingest, connectors, seeds) resolves it to (core type, sub_type) and,
#     optionally, a `provider` and `attributes`; it is never stored. An
#     alias keeps its own class: a `host` row with sub_type `serverless` is
#     class `function`. Its sub_type must be in the core type's sub_types;
#     it may be empty only when the alias has the core type's class.
#   - `sub_types` is the closed list of kinds of a core type (a sub-type is
#     a kind, never a vendor or an engine). REST and import reject any other
#     value; ingest keeps it in properties.x_native_sub_type.
#   - `sub_type_inputs` maps a legacy sub-type value that is still accepted
#     on input to { type, sub_type, provider, attributes }. Provider and
#     attributes are set only when the asset has none.
types:
  # ---------------------------------------------------------------------------
  # External surface
  # ---------------------------------------------------------------------------
  - type: domain
    label: Domain
    plural: Domains
    icon: globe
    class: domain
    legacy_category: external_surface
    identity_keys: [fqdn, name]
    attributes:
      - { name: registrar, type: string, facet: true, group: true }
      - { name: registered_at, type: time }
      - { name: expires_at, type: time }
      - { name: nameservers, type: list }
      - { name: dns_records, type: object }
      - { name: whois, type: object }
    columns: [name, registrar, expires_at, findings.open, last_seen, owner]
    card: domain
    sections: [overview, attributes, dns, findings, relationships, owners, sources, history]

  - type: subdomain
    label: Subdomain
    plural: Subdomains
    icon: globe
    class: domain
    legacy_category: external_surface
    identity_keys: [fqdn, name]
    attributes:
      - { name: parent_domain, type: string, facet: true, group: true }
      - { name: resolved_ips, type: list }
      - { name: cname_target, type: string }
      - { name: discovery_source, type: string, facet: true }
      - { name: is_wildcard, type: bool, facet: true }
    columns: [name, parent_domain, findings.open, last_seen, owner]
    card: domain
    sections: [overview, attributes, dns, services, findings, relationships, owners, sources, history]

  - type: ip_address
    label: IP Address
    plural: IP Addresses
    icon: network
    class: ip_address
    legacy_category: external_surface
    sub_type_inputs:
      ip: {}
    identity_keys: [ip, name]
    attributes:
      - { name: version, type: enum, values: ["4", "6"], facet: true }
      - { name: hostname, type: string }
      - { name: asn, type: int, facet: true, group: true }
      - { name: asn_org, type: string, facet: true, group: true }
      - { name: isp, type: string }
      - { name: country, type: string, facet: true, group: true }
      - { name: city, type: string }
      - { name: geolocation, type: object }
      - { name: ports, type: object }
      - { name: is_private, type: bool, facet: true }
      - { name: is_reserved, type: bool }
    columns: [name, asn_org, country, findings.open, last_seen, owner]
    card: ip_address
    sections: [overview, attributes, services, findings, relationships, owners, sources, history]

  - type: certificate
    label: Certificate
    plural: Certificates
    icon: shield-check
    class: certificate
    legacy_category: external_surface
    sub_type_inputs:
      ssl: {}
      tls: {}
    identity_keys: [attr.fingerprint_sha256, name]
    attributes:
      - { name: serial_number, type: string }
      - { name: subject_cn, type: string }
      - { name: sans, type: list }
      - { name: issuer_cn, type: string, facet: true, group: true }
      - { name: issuer_org, type: string, facet: true, group: true }
      - { name: not_before, type: time }
      - { name: not_after, type: time }
      - { name: signature_algorithm, type: string, facet: true }
      - { name: key_algorithm, type: string, facet: true }
      - { name: key_size, type: int, facet: true }
      - { name: fingerprint_sha256, type: string }
      - { name: is_self_signed, type: bool, facet: true }
      - { name: is_expired, type: bool, facet: true }
      - { name: is_wildcard, type: bool, facet: true }
    columns: [name, issuer_org, not_after, is_self_signed, last_seen, owner]
    card: certificate
    sections: [overview, certificate, attributes, findings, relationships, owners, sources, history]

  - type: service
    label: Service
    plural: Services
    icon: server
    class: service
    legacy_category: network
    sub_types: [http, open_port, discovered_url]
    sub_type_inputs:
      port: { sub_type: open_port }
    identity_keys: [name]
    attributes:
      - { name: port, type: int, facet: true, group: true }
      - { name: protocol, type: string, facet: true, group: true }
      - { name: transport, type: enum, values: [tcp, udp, sctp], facet: true }
      - { name: product, type: string, facet: true, group: true }
      - { name: version, type: string }
      - { name: banner, type: string }
      - { name: cpe, type: string }
      - { name: state, type: enum, values: [open, filtered, closed], facet: true }
      - { name: tls_enabled, type: bool, facet: true }
      - { name: tls_version, type: string, facet: true }
      - { name: auth_required, type: bool, facet: true }
      - { name: response_time_ms, type: int }
    columns: [name, port, protocol, product, findings.open, last_seen]
    card: service
    sections: [overview, attributes, technologies, certificate, findings, relationships, owners, sources, history]

  - type: http_service
    label: HTTP Service
    plural: HTTP Services
    icon: globe
    class: service
    alias_of: { type: service, sub_type: http }
    legacy_category: network
    identity_keys: [name]
    attributes:
      - { name: url, type: string }
      - { name: host, type: string, group: true }
      - { name: port, type: int, facet: true, group: true }
      - { name: scheme, type: enum, values: [http, https], facet: true }
      - { name: status_code, type: int, facet: true, group: true }
      - { name: title, type: string, group: true }
      - { name: content_length, type: int }
      - { name: content_type, type: string, facet: true }
      - { name: server, type: string, facet: true, group: true }
      - { name: technologies, type: list }
      - { name: cdn, type: string, facet: true, group: true }
      - { name: waf, type: string, facet: true }
      - { name: tls_version, type: string, facet: true }
      - { name: response_time_ms, type: int }
      - { name: redirect_url, type: string }
    columns: [name, status_code, title, server, findings.open, last_seen]
    card: service
    sections: [overview, attributes, technologies, certificate, findings, relationships, owners, sources, history]

  - type: open_port
    label: Open Port
    plural: Open Ports
    icon: radio
    class: service
    alias_of: { type: service, sub_type: open_port }
    legacy_category: network
    identity_keys: [name]
    attributes:
      - { name: host, type: string, group: true }
      - { name: port, type: int, facet: true, group: true }
      - { name: protocol, type: enum, values: [tcp, udp], facet: true }
      - { name: state, type: enum, values: [open, filtered], facet: true }
      - { name: service, type: string, facet: true, group: true }
      - { name: version, type: string }
      - { name: banner, type: string }
      - { name: cpe, type: string }
      - { name: discovery_tool, type: string, facet: true }
    columns: [name, port, protocol, service, findings.open, last_seen]
    card: service
    sections: [overview, attributes, findings, relationships, owners, sources, history]

  - type: discovered_url
    label: Discovered URL
    plural: Discovered URLs
    icon: link
    class: web_endpoint
    alias_of: { type: service, sub_type: discovered_url }
    legacy_category: network
    identity_keys: [name]
    attributes:
      - { name: url, type: string }
      - { name: method, type: string, facet: true }
      - { name: status_code, type: int, facet: true, group: true }
      - { name: content_type, type: string, facet: true }
      - { name: content_length, type: int }
      - { name: source, type: string, facet: true }
      - { name: depth, type: int }
      - { name: parameters, type: list }
      - { name: forms, type: object }
    columns: [name, method, status_code, content_type, findings.open, last_seen]
    card: web_endpoint
    sections: [overview, attributes, findings, relationships, owners, sources, history]

  # ---------------------------------------------------------------------------
  # Applications
  # ---------------------------------------------------------------------------
  - type: application
    label: Application
    plural: Applications
    icon: app-window
    class: application
    legacy_category: application
    sub_types: [website, web_application, api, mobile_app]
    identity_keys: [name]
    attributes:
      - { name: url, type: string }
      - { name: title, type: string }
      - { name: technologies, type: list }
      - { name: server, type: string, facet: true, group: true }
      - { name: framework, type: string, facet: true, group: true }
      - { name: authentication, type: string, facet: true }
      - { name: has_waf, type: bool, facet: true }
    columns: [name, sub_type, server, findings.open, last_seen, owner]
    card: application
    sections: [overview, attributes, technologies, findings, services, relationships, owners, sources, history]

  - type: website
    label: Website
    plural: Websites
    icon: globe
    class: application
    alias_of: { type: application, sub_type: website }
    legacy_category: application
    identity_keys: [name]
    attributes:
      - { name: url, type: string }
      - { name: title, type: string }
      - { name: technologies, type: list }
      - { name: server, type: string, facet: true, group: true }
      - { name: cms, type: string, facet: true, group: true }
      - { name: response_code, type: int, facet: true }
      - { name: tls_version, type: string, facet: true }
      - { name: has_waf, type: bool, facet: true }
      - { name: waf_vendor, type: string, facet: true }
    columns: [name, title, server, findings.open, last_seen, owner]
    card: application
    sections: [overview, attributes, technologies, findings, relationships, owners, sources, history]

  - type: web_application
    label: Web Application
    plural: Web Applications
    icon: app-window
    class: application
    alias_of: { type: application, sub_type: web_application }
    legacy_category: application
    identity_keys: [name]
    attributes:
      - { name: url, type: string }
      - { name: title, type: string }
      - { name: technologies, type: list }
      - { name: server, type: string, facet: true, group: true }
      - { name: framework, type: string, facet: true, group: true }
      - { name: response_code, type: int, facet: true }
      - { name: has_waf, type: bool, facet: true }
    columns: [name, title, framework, findings.open, last_seen, owner]
    card: application
    sections: [overview, attributes, technologies, findings, relationships, owners, sources, history]

  - type: api
    label: API
    plural: APIs
    icon: code
    class: application
    alias_of: { type: application, sub_type: api }
    legacy_category: application
    identity_keys: [name]
    attributes:
      - { name: base_url, type: string }
      - { name: api_type, type: enum, values: [rest, graphql, grpc, soap, websocket], facet: true, group: true }
      - { name: version, type: string }
      - { name: authentication, type: enum, values: [none, api_key, oauth2, jwt, basic], facet: true }
      - { name: documentation_url, type: string }
      - { name: rate_limiting, type: bool, facet: true }
      - { name: cors_enabled, type: bool, facet: true }
      - { name: endpoints_count, type: int }
    columns: [name, api_type, authentication, findings.open, last_seen, owner]
    card: application
    sections: [overview, attributes, findings, relationships, owners, sources, history]

  - type: mobile_app
    label: Mobile App
    plural: Mobile Apps
    icon: smartphone
    class: application
    alias_of: { type: application, sub_type: mobile_app }
    legacy_category: application
    identity_keys: [attr.package_name, name]
    attributes:
      - { name: platform, type: enum, values: [ios, android], facet: true, group: true }
      - { name: package_name, type: string }
      - { name: version, type: string }
      - { name: store_url, type: string }
      - { name: min_sdk_version, type: string }
      - { name: target_sdk_version, type: string }
      - { name: permissions, type: list }
      - { name: uses_ssl_pinning, type: bool, facet: true }
    columns: [name, platform, version, findings.open, last_seen, owner]
    card: application
    sections: [overview, attributes, findings, relationships, owners, sources, history]

