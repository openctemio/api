name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26.8"

jobs:
  # ============================================
  # Build - Cross-compile bootstrap-admin (creates the first platform administrator)
  # ============================================
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build bootstrap-admin
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="bootstrap-admin"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="bootstrap-admin.exe"
          fi

          go build \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.VERSION }}" \
            -o "bin/${BINARY_NAME}" \
            ./cmd/bootstrap-admin

      - name: Package binary
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE_NAME="bootstrap-admin-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"

          cd bin
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip "../${ARCHIVE_NAME}.zip" bootstrap-admin.exe
          else
            tar czf "../${ARCHIVE_NAME}.tar.gz" bootstrap-admin
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-admin-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # Release - Create GitHub Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts
          pattern: bootstrap-admin-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: /tmp/artifacts
        run: |
          sha256sum *.tar.gz *.zip > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ## Docker Images

            Images are published to **GitHub Container Registry** (multi-arch: amd64 + arm64):

            ```bash
            # API
            docker pull ghcr.io/openctemio/api:${{ steps.version.outputs.VERSION }}

            # Database Migrations
            docker pull ghcr.io/openctemio/migrations:${{ steps.version.outputs.VERSION }}

            # Database Seed
            docker pull ghcr.io/openctemio/seed:${{ steps.version.outputs.VERSION }}

            # bootstrap-admin (creates the first platform administrator)
            docker pull ghcr.io/openctemio/admin-cli:${{ steps.version.outputs.VERSION }}
            ```

            > Images are also mirrored to Docker Hub (`openctemio/*`) if configured.

            ## Deployment

            ```bash
            # Update version in your .env.versions file
            API_VERSION=${{ steps.version.outputs.VERSION }}
            MIGRATIONS_VERSION=${{ steps.version.outputs.VERSION }}

            # Pull and restart
            docker compose pull
            docker compose up -d
            ```
          files: |
            /tmp/artifacts/*.tar.gz
            /tmp/artifacts/*.zip
            /tmp/artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 - notes.md <<'PY'
          import re, sys
          path = sys.argv[1]
          text = re.sub(r" ?<[^<>\s]+@[^<>\s]+>", "", open(path).read())
          mention = re.compile(r"(?<![\w`/.@-])(?<!by )(?<!\* )@[A-Za-z0-9][\w-]*(?:/[\w.-]+)?(?:@[\w.^~-]+)?")
          parts = re.split(r"(`[^`]*`)", text)
          text = "".join(p if p.startswith("`") else mention.sub(lambda m: "`" + m.group(0) + "`", p) for p in parts)
          open(path, "w").write(text)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
