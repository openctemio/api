# Also publish port 80 on the gateway: HTTP->HTTPS redirect and the ACME
# HTTP-01 challenge. For OPENCTEM_TLS_MODE=acme (port 443 alone already works
# for Let's Encrypt through TLS-ALPN-01).
#
#   docker compose -f docker-compose.yml -f docker-compose.http-redirect.yml up -d
services:
  gateway:
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_HTTP_PORT:-80}:80"
