name: CodeQL

# Advanced setup, one matrix over the languages to analyse. Default setup is NOT used:
# it is undocumented whether it finds a go.mod in a subdirectory, and Go has
# no build-mode `none`, so the Go leg builds explicitly inside api/.
# `category` keeps the two languages' results separate (the documented
# monorepo pattern). '/language:go' is the category openctemio/api already
# used, so existing Go alerts keep matching after the move.
#
# Which languages: on a pull request (and merge_group) only the side that
# changed (api/ -> go, web/ -> javascript-typescript, shared files -> both;
# rules in .github/scripts/changed.sh). On a push to develop/main and on the
# weekly schedule, ALWAYS both: code scanning compares each PR against the
# latest analysis of every category on the base branch, so the base needs a
# fresh baseline for both languages.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.lang.outputs.languages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/changed.sh
      - id: lang
        env:
          EVENT: ${{ github.event_name }}
          API: ${{ steps.f.outputs.api }}
          WEB: ${{ steps.f.outputs.web }}
        run: |
          if [[ "$EVENT" == push || "$EVENT" == schedule ]]; then API=true WEB=true; fi
          langs=()
          [[ "$API" == true ]] && langs+=('"go"')
          [[ "$WEB" == true ]] && langs+=('"javascript-typescript"')
          languages="[$(IFS=,; echo "${langs[*]}")]"
          echo "languages=$languages" | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Initialize CodeQL (go)
        if: matrix.language == 'go'
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality
      - name: Build (go)
        if: matrix.language == 'go'
        working-directory: api
        env:
          GOWORK: "off"
        run: go build ./...
      - name: Initialize CodeQL (javascript-typescript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          # Analyse the web app only (api/ has a k6 script and doc snippets).
          config: |
            paths:
              - web
            paths-ignore:
              - '**/node_modules/**'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  codeql-ok:
    name: CodeQL OK
    if: always()
    needs: [changes, analyze]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null
