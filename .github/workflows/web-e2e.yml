name: Web E2E

# Runs the Playwright suite (web/e2e) against a real stack: the production
# images of the API and the web app, Postgres, Redis and the migrations, from
# web/e2e/ci/compose.yml, seeded by web/e2e/ci/seed.sh.
#
# Not a required check (yet): it reports on its own and does not join the
# `Web CI OK` aggregate. The `changes` job (.github/scripts/changed.sh) gates
# the run, so an API-only change does not start the stack. The suite needs the
# API as well, but the API has its own tests; this job is about the web app.
#
# When it runs. It is the slowest job (three image builds and a full stack), and
# the merge queue tests every pull request again on top of the latest develop,
# so running it on the pull request too spent a runner twice for one answer.
#   merge queue   always (when the web changed)
#   pull request  only with the `run-e2e` label, or when the suite itself
#                 (web/e2e/, this workflow) changed

on:
  pull_request:
    branches: [main, develop]
    # labeled: adding `run-e2e` to a pull request starts the suite.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.f.outputs.web }}
      suite: ${{ steps.suite.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/changed.sh
      # Did a pull request change the suite itself? Then it runs on the PR.
      - id: suite
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '^(web/e2e/|\.github/workflows/web-e2e\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright e2e
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' && (
        github.event_name != 'pull_request' ||
        needs.changes.outputs.suite == 'true' ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_IMAGE: local/openctem-api:e2e
      WEB_IMAGE: local/openctem-web:e2e
      ADMIN_IMAGE: local/admin-cli:e2e
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The three images build in parallel (web/e2e/ci/docker-bake.hcl) with
      # the GitHub Actions layer cache: on a web-only change the API and
      # admin-cli layers come from the cache, so the web build sets the pace.
      - name: Build images
        uses: docker/bake-action@v7
        with:
          source: .
          files: web/e2e/ci/docker-bake.hcl

      # Fresh random passwords and secrets for this run (masked in the log),
      # written to web/e2e/ci/.env for compose and exported to later steps.
      - name: Generate the stack's secrets
        run: bash web/e2e/ci/make-env.sh

      - name: Start the stack
        run: docker compose -f web/e2e/ci/compose.yml up -d --wait --wait-timeout 180

      - name: Seed a tenant
        run: bash web/e2e/ci/seed.sh > web/e2e/.env

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Playwright version
        id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Run the suite
        working-directory: web
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:8080
        run: npm run e2e

      - name: Stack logs
        if: failure()
        run: docker compose -f web/e2e/ci/compose.yml logs --no-color --tail 300 api web > e2e-stack.log 2>&1 || true

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
            e2e-stack.log
          retention-days: 7
