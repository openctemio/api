name: Fuzz

# Nightly fuzzing of the parsers that read untrusted sensor bytes
# (RFC-026 WP-A3: the strict CTIS decoder of protocol v2 results). Runs on a
# schedule and on demand, never on pull requests: a fuzz run is open-ended and
# would make PR CI slow and non-deterministic. A crash uploads the failing
# input so it can be added to testdata/fuzz as a regression seed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-ctis:
    name: FuzzStrictCTIS (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Fuzz the strict CTIS decoder
        run: go test ./internal/app/ingest/ -run '^$' -fuzz '^FuzzStrictCTIS$' -fuzztime 10m

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-strict-ctis-crasher
          path: internal/app/ingest/testdata/fuzz/
          if-no-files-found: ignore
