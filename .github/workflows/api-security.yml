name: API Security

# Carried over from openctemio/api's security.yml. CodeQL moved to codeql.yml
# (one workflow, both languages) and secret scanning to repo-security.yml (it
# scans the whole repository history, not one component).

# No required check lives here, so this workflow uses `paths:` and does not
# start at all for a web-only change. Same routing as .github/scripts/changed.sh
# (api/ + shared files); keep the two in step. The weekly schedule and
# merge_group ignore `paths:` and scan everything.

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  pull_request:
    branches: [main, develop, ci-test-base]
    paths:
      - 'api/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  merge_group:
  schedule:
    - cron: '0 0 * * 1' # Monday 00:00 UTC; schedules run from the default branch (main)

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Go version: setup-go reads api/go.mod (its `toolchain` directive), the same
# version api/Dockerfile builds with. setup-go also sets GOTOOLCHAIN=local, so a
# separate pin here would silently test and govulncheck an OLDER Go than ships.
env:
  GOWORK: "off"

defaults:
  run:
    working-directory: api

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck
        run: govulncheck ./...

  trivy:
    name: Trivy Vulnerability Scanner (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'api'
          trivy-config: 'api/trivy.yaml'
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,misconfig'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-api.sarif'
          category: trivy-api

  semgrep:
    name: Semgrep (api)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@v7
      # Scanned from the repository root with `api` as the target, so the SARIF
      # paths are repository-relative (api/internal/...). Scanned from inside
      # api/, they would be internal/... and code scanning would place the
      # alerts on files that do not exist in this repository.
      - name: Run Semgrep
        working-directory: .
        run: >-
          semgrep scan --metrics=off --sarif --output semgrep-api.sarif
          --config p/golang --config p/secrets --config p/dockerfile
          --exclude 'vendor' --exclude '*_test.go'
          api
      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep-api.sarif
          category: semgrep # same category as before the move, so existing alerts keep matching

  snyk:
    name: Snyk Security Scan (api)
    if: vars.ENABLE_SNYK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=api/go.mod

  license-check:
    name: License Compliance (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: go-licenses check ./... --disallowed_types=forbidden,restricted || true
        continue-on-error: true

  # Weekly sweep + main pushes + PRs into main (release candidates). Not on every
  # PR: building the image costs minutes and the fs scan covers dependencies.
  docker-scan:
    name: Docker Image Scan (api)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: false
          load: true
          tags: openctem-api:scan
      - name: Run Trivy on the image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'openctem-api:scan'
          format: 'sarif'
          output: 'trivy-docker-api.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-docker-api.sarif'
          category: docker # unchanged from openctemio/api
