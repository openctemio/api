name: Web Security

# Carried over from openctemio/ui's security.yml. CodeQL moved to codeql.yml and
# secret scanning to repo-security.yml.

# No required check lives here, so this workflow uses `paths:` and does not
# start at all for an API-only change. Same routing as .github/scripts/changed.sh
# (web/ + shared files); keep the two in step. The weekly schedule scans
# everything. No merge_group trigger: it cannot be path-filtered, the PR run
# already scanned the change, and the push to the branch scans it again.

on:
  push:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'web/**'
      - 'Makefile'
      - 'go.work'
      - 'go.work.sum'
      - '.github/**'
      - 'deploy/**'
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/') }}

# Node version: web/.nvmrc, the same major web/Dockerfile ships (node:26-alpine).
defaults:
  run:
    working-directory: web

jobs:
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Run npm audit (JSON output)
        run: npm audit --json > npm-audit-results.json || true
      - name: Upload audit results
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          path: web/npm-audit-results.json
          retention-days: 30

  trivy:
    name: Trivy Vulnerability Scanner (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'web'
          format: 'sarif'
          output: 'trivy-web.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,misconfig'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-web.sarif'
          category: trivy-web

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install SARIF formatter
        run: npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0
      - name: Run ESLint
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true
      - name: Upload ESLint results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: web/eslint-results.sarif
          category: eslint-web
        continue-on-error: true

  snyk:
    name: Snyk Security Scan (web)
    if: vars.ENABLE_SNYK == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=web/package.json

  docker-scan:
    name: Docker Image Scan (web)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: web
          push: false
          load: true
          tags: openctem-web:scan
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080
      - name: Run Trivy on the image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'openctem-web:scan'
          format: 'sarif'
          output: 'trivy-docker-web.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-docker-web.sarif'
          category: docker-web
