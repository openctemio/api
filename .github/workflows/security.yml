name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # CodeQL Analysis - GitHub's native SAST
  # ============================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-and-quality

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:go'

  # ============================================
  # Go Vulnerability Check
  # ============================================
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install govulncheck
        # pinned (was @latest) — avoid CI-breaking tool drift
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  # ============================================
  # Trivy - Dependency & Misconfiguration Scan
  # ============================================
  trivy:
    name: Trivy Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,secret,misconfig'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # Secret Scanning with Gitleaks (Optional)
  # ============================================
  # Requires GITLEAKS_LICENSE secret for organizations
  # Enable by setting repository variable ENABLE_GITLEAKS=true
  # Note: Trivy also scans for secrets as a backup
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_GITLEAKS == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================
  # Snyk Security Scan (Optional - requires SNYK_TOKEN)
  # ============================================
  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_SNYK == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # ============================================
  # License Compliance Check
  # ============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install go-licenses
        # pinned (was @latest) — avoid CI-breaking tool drift
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check licenses
        run: |
          go-licenses check ./... --disallowed_types=forbidden,restricted || true
        continue-on-error: true

  # ============================================
  # Docker Image Scan (main branch pushes + the weekly sweep)
  # ============================================
  #
  # The weekly cron is the only thing that catches a CVE disclosed against an
  # already-shipped base image, since that needs no code change to appear. This
  # job used to require `event_name == 'push'`, which excluded the cron — a
  # scheduled run reported green having never built or scanned the image. Verified
  # on run 30234329982: "Docker Image Scan: skipped".
  #
  # Still skipped on pull requests: building the image on every PR costs minutes
  # and the filesystem Trivy scan already covers PR-introduced dependencies.
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    # Also on a PR into main — that is a release candidate, and this job builds
    # the image itself rather than pulling a published one, so it can run before
    # the tag exists. Scanning the image only after it is already published is
    # the wrong order for a security product: docker-publish.yml triggers on the
    # `v*` tag, so today the first scan happens after customers can pull it.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: openctem-api:scan

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'openctem-api:scan'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Docker scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: docker
