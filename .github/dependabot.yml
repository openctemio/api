# Dependabot for the monorepo: one entry per ecosystem and directory.
# Carried over from openctemio/api (gomod) and openctemio/ui (npm); the two
# github-actions entries collapse into one, since workflows now live only in
# /.github/workflows. Dependabot reads this file from the DEFAULT branch (main),
# so it must land on main as well as develop.
#
# `reviewers` was dropped: the referenced team (openctemio/security) does not
# exist, and GitHub moved reviewer assignment for Dependabot PRs to CODEOWNERS.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels: ["dependencies", "go", "api"]
    commit-message:
      prefix: "deps(api)"
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The protocol-v1 compat harness pins the LAST RELEASED sdk-go on purpose
  # (api/tests/compat/v1); never let Dependabot move it.
  - package-ecosystem: "gomod"
    directory: "/api/tests/compat/v1"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "go", "api"]
    commit-message:
      prefix: "deps(api-compat)"
    ignore:
      - dependency-name: "github.com/openctemio/sdk-go"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    labels: ["dependencies", "npm", "web"]
    commit-message:
      prefix: "deps(web)"
    versioning-strategy: increase
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      nextjs:
        patterns: ["next", "@next/*", "eslint-config-next"]
      testing:
        patterns: ["@testing-library/*", "vitest", "@vitest/*", "jest", "@types/jest"]
      linting:
        patterns: ["eslint", "eslint-*", "@eslint/*", "prettier", "@typescript-eslint/*"]
      typescript:
        patterns: ["typescript", "@types/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss", "autoprefixer"]
      radix-ui:
        patterns: ["@radix-ui/*"]
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns: ["react", "react-dom", "next", "@next/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-name: "*"
        dependency-type: "all"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "deps(actions)"
