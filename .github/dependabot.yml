# Dependabot configuration for OpenCTEM API
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    # Target the integration branch — the repo's workflow is "PRs target develop,
    # never main". Without this, dependabot bases PRs on the default branch (main),
    # which can be behind develop and fail CI (e.g. a chi bump flagging RealIP that
    # develop has already removed).
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    reviewers:
      - "openctemio/security"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps(go)"
    groups:
      # Group minor and patch updates together
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates are always separate
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    reviewers:
      - "openctemio/security"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"

  # Docker base-image updates are intentionally NOT managed by Dependabot.
  # The Dockerfiles pin base images on public.ecr.aws (ECR Public) to avoid
  # Docker Hub pull rate limits in CI. Dependabot's docker updater cannot
  # authenticate/query ECR Public for tags (it fails every run with
  # "DENIED Not Authorized" / HTTP 429), so the job only ever errored and never
  # produced a PR. Bump base images manually instead.
